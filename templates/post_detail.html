{{ define "content" }}
<section class="post-form-section container">
    <h1>Create New Post</h1>

    <form action="/posts/new" method="POST" class="post-form">
       <input type="hidden" name="csrf_token" id="csrf_token_input">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required maxlength="100" placeholder="Enter post title">
        <label>Categories</label>
        <div class="category-chip-group">
            {{ range .Categories }}
                <label class="category-chip">
                    <input type="checkbox" name="categories" value="{{ .ID }}">
                    <span>{{ .Name }}</span>
                </label>
            {{ end }}
        </div>
        <label for="content">Content</label>
        <textarea id="content" name="content" rows="8" placeholder="Write your post here..." required></textarea>

        <div class="form-buttons">
            <button type="button" class="btn cancel-btn" onclick="window.location.href='/'">Cancel</button>
            <button type="submit" class="btn primary-btn">Submit</button>
        </div>
    </form>
</section>
{{ end }}
